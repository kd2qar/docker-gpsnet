x-anchors: # CREATE ANCHOR VARIABLES SPECIFIC TO LOCAL ENVIRONMENT
  PORT: &port ${PORT-50505}
  PORT2: &port_test ${PORT_TEST:-50506}
  HOSTIP: &hostip ${HOST_IP}
  GPSD_SERVER: &gpsd_server ${GPSD_SERVER}
  CONTAINER: &container gpsnet

services:
  gpsnet:
    container_name: *container
    image: &image kd2qar/gpsnet
    environment:
      PORT: *port
      HOSTIP: *hostip
      GPSD_SERVER: *gpsd_server
      CONTAINER: *container
      PORT_TEST: *port_test
    build:
      context: .
      args:
        GPSD_SERVER: *gpsd_server
        PORT: *port
        HOSTIP: *hostip
      dockerfile: Dockerfile
      tags:
        - *image
    hostname: *container
    network_mode: bridge
    ports:
      - target: *port
        host_ip: *hostip
        published: *port
        protocol: "tcp"
      - target: *port_test
        host_ip: *hostip
        published: *port_test
        protocol: "tcp"
    volumes:
      - /etc/localtime:/etc/localtime:ro

    #command: /bin/bash
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
